# Continuous Integration — build the project and run all tests on every push and PR.
name: CI

# Trigger on any push and on pull requests.
on: [push, pull_request]

jobs:
  build:
    # A fresh Ubuntu VM that starts with nothing installed — we set it up in the steps below.
    runs-on: ubuntu-latest

    steps:
      # 1. Check the repository out onto the runner.
      - uses: actions/checkout@v4

      # 2. Install Java (Temurin 21, an LTS the code is fully compatible with) and turn on
      #    Gradle dependency caching so later runs are faster.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # 3. Build and run the test suite. The `build` task also runs `test`, so this both
      #    compiles the project and executes all JUnit tests.
      - name: Build and test
        run: ./gradlew build
