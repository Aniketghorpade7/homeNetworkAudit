plugins {
    id 'application'          // gives us the `run` task + packaging later
}

repositories {
    mavenCentral()            // where dependencies (like JUnit) are downloaded from
}

dependencies {
    // JUnit 5 — set up now so Phase 6 (tests) is ready to go
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.homeaudit.NetworkParser'   // the class with main()
}

tasks.named('test') {
    useJUnitPlatform()        // tells Gradle to use JUnit 5
}